# Builds the Android wrapper. Exists so that shipping never requires Android
# Studio on a local machine: push, wait, download the artifact from the run.
#
# Without signing secrets it still builds and uploads an UNSIGNED bundle plus a
# debug APK you can sideload — useful before a key exists. With them, it
# produces the signed .aab that Play accepts.
name: Android

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Secrets are lifted to job-level env because a step's `if:` cannot read
    # the `secrets` context at all — it is not in the list of contexts allowed
    # there, and using it does not fail the step, it fails the whole WORKFLOW
    # before any job starts. `env` at job level IS readable from a step `if`,
    # which is what makes the guards below work.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android step: the ubuntu runner already ships the SDK at
      # ANDROID_HOME, and android-actions/setup-android@v3 fails outright
      # trying to install the long-removed `tools` package.

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The keystore never exists in the repository. It arrives as a base64
      # secret, is written outside any tracked path's reach for the length of
      # the job, and the passwords stay in the environment.
      - name: Restore signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "signing key restored ($(stat -c%s android/app/release.keystore) bytes)"

      - name: Build release bundle
        working-directory: android
        run: gradle --no-daemon bundleRelease

      # A sideloadable APK as well as the bundle, because an .aab cannot be
      # installed on a phone directly and the first thing worth doing is
      # playing it on a real device.
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      # KEYSTORE_PASSWORD is already in the job env and is only ever tested for
      # emptiness here. Interpolating a secret into the script body with ${{ }}
      # would paste its value into the shell, which is how secrets reach logs.
      - name: Say what came out
        run: |
          echo "### Android build" >> "$GITHUB_STEP_SUMMARY"
          find android/app/build/outputs \( -name '*.aab' -o -name '*.apk' \) -print | while read -r f; do
            echo "- \`${f#android/app/build/outputs/}\` — $(du -h "$f" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The bundle is **unsigned** — no signing secrets are set. See \`android/README.md\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: last-isle-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
