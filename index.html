<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Island Defence</title>
<meta name="theme-color" content="#1d2a16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Island Defence">
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --gold:#ffd34d; --cream:#f5e1ad; --ink:#21140d;
    --wood:#70451f; --wood-d:#3c2413; --panel:rgba(28,30,20,.74);
  }
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1d2a16;
    touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;font-family:Arial,Helvetica,sans-serif}
  button{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  img{pointer-events:none}
  #game{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}

  /* ---- Boot card -------------------------------------------------------
     Inline and dependency-free so it paints on the first frame, before a
     single asset has downloaded. It is what covers the load, so nothing in
     it may itself need loading. Same reasoning as the Rivenmark shell. */
  #boot{position:fixed;inset:0;z-index:90;display:grid;place-items:center;
    background:radial-gradient(120% 80% at 50% 36%,#2c4022,#141d10 70%);
    color:#cfe0b4;transition:opacity .4s ease}
  #boot.out{opacity:0;pointer-events:none}
  #boot h1{margin:0;font:900 clamp(30px,7vw,58px)/1 Arial;letter-spacing:4px;
    color:var(--gold);text-shadow:0 5px 0 #3f2a12,0 8px 14px #000}
  #boot .sub{margin:12px 0 26px;font:700 clamp(11px,2.4vw,15px) Arial;
    letter-spacing:3px;color:#9fb488}
  #boot .bar{width:min(280px,54vw);height:5px;border-radius:3px;background:#1b2614;
    border:1px solid #33462a;overflow:hidden;margin:0 auto}
  #boot .bar>i{display:block;height:100%;width:4%;border-radius:3px;
    background:linear-gradient(90deg,#6d4d22,var(--gold));transition:width .2s ease}
  #boot .say{margin:12px 0 0;font:700 11px Arial;letter-spacing:1px;color:#6f8460}
  #boot .wrap{text-align:center;padding:0 24px}

  /* ---- Shared overlay furniture ---------------------------------------- */
  .overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;
    justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right)
    env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .overlay.show{display:flex}
  .overlay .shade{position:absolute;inset:0;background:rgba(0,0,0,.62)}
  .win{position:relative;width:min(700px,92vw);height:min(660px,88vh);
    display:flex;align-items:center;justify-content:center}
  /* window.png is a nine-slice-ish frame; object-fit:fill is deliberate so the
     frame always meets the content box exactly at any aspect. */
  .win>.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
  .win>.hdr{position:absolute;left:11%;top:-6%;width:78%;height:22%;
    object-fit:contain;z-index:3}
  .win .body{position:absolute;left:13%;right:13%;top:23%;bottom:9%;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center}
  .iconBtn{border:0;background:transparent;padding:0}
  .iconBtn img{display:block;width:100%;height:100%;object-fit:contain}
  .iconBtn:active{transform:scale(.94)}

  /* ---- Menu ------------------------------------------------------------- */
  /* No `display` here on purpose: an id rule would outrank `.overlay`'s
     display:none and leave the menu permanently on top of the board,
     invisible and still swallowing every tap. Visibility is `.show` only. */
  #menu{z-index:60;background:#0f1609}
  #menuBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    filter:brightness(.55) saturate(.85)}
  #menu::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.6))}
  #menuPanel{position:relative;z-index:2;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;width:92vw;height:92vh}
  #menuTitle{margin:0;color:var(--gold);font:900 clamp(38px,8vw,84px)/.92 Arial;
    letter-spacing:2px;text-align:center;text-shadow:0 7px 0 #57230d,0 11px 18px #000}
  #menuSub{margin:0 0 4px;color:#ffe9b0;font:900 clamp(12px,2.4vw,22px) Arial;
    letter-spacing:2px;text-shadow:2px 3px 0 #32170d}
  #menuPlay{width:min(300px,54vw);height:min(150px,20vh)}
  #menuBest{margin-top:2px;color:#fff4cf;font:700 13px Arial;text-shadow:2px 2px #000}
  #menuAudio{position:absolute;z-index:3;right:max(3vw,env(safe-area-inset-right));
    bottom:max(3vh,env(safe-area-inset-bottom));display:flex;gap:10px}
  .audioBtn{width:min(66px,11vw);height:min(66px,11vw)}

  /* ---- Level select ----------------------------------------------------- */
  /* Above #menu for the same reason the difficulty window is: it opens on top
     of the menu rather than replacing it. */
  #levelOverlay{z-index:65}
  #levelWin{width:min(900px,95vw);height:min(680px,90vh)}
  #levelTitle{position:absolute;z-index:3;left:0;right:0;top:6%;margin:0;
    text-align:center;color:var(--gold);font:900 clamp(19px,3.4vw,32px) Arial;
    letter-spacing:3px;text-shadow:0 4px 0 #57230d,0 6px 10px #000}
  #levelTotal{position:absolute;z-index:3;left:0;right:0;top:17%;text-align:center;
    color:var(--gold);font:900 clamp(12px,2vw,18px) Arial;letter-spacing:2px;
    text-shadow:2px 2px #21140d}
  #levelGrid{position:absolute;z-index:3;left:9%;right:9%;top:24%;bottom:7%;
    display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
    overflow-y:auto;padding:2px;-webkit-overflow-scrolling:touch}
  .levelCard{position:relative;border:3px solid #c79645;border-radius:12px;
    background:#3c2413;padding:0;overflow:hidden;min-height:0;
    box-shadow:0 3px 7px #0008;display:flex;flex-direction:column}
  .levelCard .thumb{width:100%;flex:1;min-height:0;display:block;object-fit:cover}
  .levelCard .cap{padding:4px 6px 5px;background:linear-gradient(#5b3618,#3c2413);
    display:flex;flex-direction:column;gap:1px}
  .levelCard .n{font:900 clamp(9px,1.4vw,13px) Arial;color:#ffe8a3;
    text-shadow:1px 1px 2px #000;letter-spacing:.5px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .levelCard .st{font-size:clamp(10px,1.5vw,14px);color:var(--gold);letter-spacing:2px}
  .levelCard .st i{color:#6b5533;font-style:normal}
  .levelCard.locked{filter:grayscale(1) brightness(.5);border-color:#6b5533}
  .levelCard.locked .st{font:900 9px Arial;color:#b9a479;letter-spacing:1px}
  .levelCard:not(.locked):active{transform:scale(.97)}
  #levelClose{position:absolute;right:-2%;top:-4%;width:58px;height:58px;z-index:5}
  @media(max-width:760px){
    #levelGrid{grid-template-columns:repeat(2,1fr);gap:8px;left:7%;right:7%}
    #levelClose{width:44px;height:44px}
  }
  @media(max-height:460px){
    #levelGrid{grid-template-columns:repeat(3,1fr);gap:6px;top:26%}
    .levelCard .n{font-size:9px}
  }

  /* ---- Difficulty ------------------------------------------------------- */
  /* Above #menu: it opens on top of the menu rather than replacing it, so it
     has to outrank it or it renders behind and swallows every tap. */
  #diffOverlay{z-index:70}
  #diffChoices{position:absolute;left:16%;right:16%;top:26%;bottom:7%;z-index:2;
    display:flex;flex-direction:column;justify-content:space-between}
  .diffBtn{width:100%;height:29%}

  /* ---- Result (failed / victory) --------------------------------------- */
  #resultArt{width:min(320px,60%);max-height:42%;object-fit:contain}
  #resultMsg{margin-top:6px;text-align:center;color:#f2dca5;
    font:900 clamp(19px,3.6vw,34px) Arial;text-shadow:3px 3px 0 #3b2416;line-height:1.2}
  #resultStars{margin-top:10px;font-size:clamp(24px,5vw,40px);letter-spacing:6px;
    color:#ffd34d;text-shadow:2px 2px 0 #3b2416}
  #resultStars .off{color:#5c4a2a}
  #resultStats{margin-top:14px;width:min(340px,86%);
    font:700 clamp(11px,1.9vw,15px) Arial;color:#e7d3a4}
  #resultStats div{display:flex;justify-content:space-between;padding:3px 0;
    border-bottom:1px solid rgba(233,211,164,.18)}
  #resultStats b{font-weight:700;letter-spacing:1px;color:#b9a479}
  #resultStats span{font-weight:900;color:#fff2cd}
  #resultStats:empty{display:none}
  #resultBtns{position:absolute;left:16%;right:16%;bottom:2%;z-index:3;
    display:flex;justify-content:center;gap:6%}
  .resultBtn{width:26%;max-width:118px;aspect-ratio:1}

  /* ---- Upgrade ---------------------------------------------------------- */
  #upgradeWin{width:min(860px,94vw);height:min(680px,88vh)}
  #upgradePanel{position:absolute;left:9%;right:9%;top:20%;bottom:6%;z-index:2;
    border:5px solid #75451f;border-radius:24px;background:rgba(58,34,20,.95);
    box-shadow:inset 0 0 0 3px #b66b2b,0 8px 20px #000b;
    padding:14px;box-sizing:border-box;display:flex;flex-direction:column}
  #upgradeName{text-align:center;color:var(--cream);
    font:900 clamp(17px,3.2vw,30px) Arial;text-shadow:3px 3px #21140d}
  #upgradeMeta{text-align:center;margin:3px 0 8px;color:var(--gold);
    font:900 clamp(11px,2vw,17px) Arial;text-shadow:2px 2px #21140d}
  #upgradeCards{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    min-height:0}
  #specRow{flex:0 0 auto}
  .upCard{position:relative;border:0;background:transparent;padding:0;min-width:0;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
  .upCard>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .upCard .lbl{position:relative;z-index:2;font:900 clamp(10px,1.9vw,16px) Arial;
    color:var(--cream);text-shadow:2px 2px #21140d;text-align:center;line-height:1.15}
  .upCard .pips{position:relative;z-index:2;margin:3px 0 2px;letter-spacing:3px;
    font-size:clamp(9px,1.6vw,13px);color:var(--gold);text-shadow:1px 1px #21140d}
  .upCard .pips .off{color:#6b5533}
  .upCard .buy{position:relative;z-index:2;margin-bottom:6%;padding:2px 9px;
    border-radius:9px;background:#1d120b;border:2px solid #d8b56a;color:#fff;
    font:900 clamp(10px,1.7vw,14px) Arial}
  .upCard[disabled]{opacity:.45}
  .upCard:not([disabled]):active{transform:scale(.95)}

  /* The specialisation fork. Hidden until a track is maxed, then two cards;
     after one is bought, a single banner saying which. It is deliberately a
     different shape to the three stat cards above it — a permanent, one-time
     choice should not look like another rung on a ladder. */
  #specRow{margin-top:8px}
  #specRow:empty{display:none}
  #specHdr{text-align:center;color:#ffcf7a;letter-spacing:1.5px;
    font:900 clamp(9px,1.5vw,12px) Arial;text-shadow:2px 2px #21140d;
    margin-bottom:5px}
  #specPick{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch}
  .specCard{border:3px solid #8a6a2e;border-radius:14px;background:#2a1a0f;
    padding:7px 8px;text-align:left;color:var(--cream);min-width:0;
    display:flex;flex-direction:column;gap:3px}
  .specCard .n{font:900 clamp(11px,1.9vw,15px) Arial;color:var(--gold);
    text-shadow:2px 2px #21140d}
  .specCard .d{font:700 clamp(8px,1.35vw,11px) Arial;line-height:1.3;
    color:#e6d3a8;white-space:pre-line}
  .specCard .buy{align-self:flex-start;margin-top:auto;padding:2px 9px;
    border-radius:9px;background:#1d120b;border:2px solid #d8b56a;color:#fff;
    font:900 clamp(10px,1.6vw,13px) Arial}
  .specCard[disabled]{opacity:.45}
  .specCard:not([disabled]):active{transform:scale(.97)}
  #specHas{border:3px solid #c08a34;border-radius:14px;background:#3a2a12;
    padding:7px 10px;text-align:center}
  #specHas .n{font:900 clamp(12px,2.1vw,17px) Arial;color:#ffd98a;
    text-shadow:2px 2px #21140d}
  #specHas .d{font:700 clamp(8px,1.35vw,11px) Arial;color:#e6d3a8;
    line-height:1.3;white-space:pre-line;margin-top:2px}
  #upgradeActions{display:flex;align-items:center;justify-content:space-between;
    gap:10px;height:22%;margin-top:6px}
  #upgradeActions .iconBtn{height:100%;width:34%}
  #upgradeClose{position:absolute;right:-2%;top:-4%;width:62px;height:62px;z-index:5}

  /* ---- HUD -------------------------------------------------------------- */
  #hud{position:fixed;inset:0;z-index:10;pointer-events:none;color:#fff;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
      env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #hud.hide{display:none}
  #stats{position:absolute;left:2vw;top:2vh;width:min(330px,36vw);min-width:210px;
    padding:9px 12px;border:3px solid var(--wood);border-radius:20px;
    background:var(--panel);box-shadow:0 5px 14px #0009;
    display:grid;grid-template-columns:1fr 1fr;gap:4px 6px}
  .stat{position:relative;height:34px}
  .stat img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
  .stat b{position:absolute;left:11px;top:8px;z-index:2;font:900 9px Arial;
    color:#fff;text-shadow:2px 2px 3px #000;letter-spacing:.5px}
  .stat span{position:absolute;right:12px;top:3px;z-index:2;font:900 16px Arial;
    text-shadow:2px 2px 3px #000}

  /* The three wave panels stack in one column instead of each placing itself.
     Hand-placed `top` values cannot work here: every panel's height depends on
     its content — how many kinds are in the next wave, how many warnings,
     whether a wager row is up — so any fixed offset is right for one wave and
     wrong for the next. Five of six viewports were overlapping before this. */
  #waveStack{position:absolute;left:50%;top:2vh;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:6px;
    max-width:min(460px,86vw)}
  /* Centred at the top only where there is room beside the stats box. Below
     about 1100px the two meet in the middle, so the stack drops underneath
     it instead — there is a screenful of unused space above the board and
     none to the left of it. */
  @media(max-width:1100px){ #waveStack{top:120px} }
  #battleInfo{
    min-width:172px;padding:7px 16px;border:3px solid var(--wood);border-radius:16px;
    background:var(--panel);box-shadow:0 5px 12px #0008;text-align:center;
    text-shadow:2px 2px 3px #000}
  #waveLabel{font:900 clamp(15px,2.4vw,24px) Arial;color:var(--gold)}
  #waveState{font:900 10px Arial;color:var(--cream);margin-top:1px;letter-spacing:1px}
  #enemyCount{font:900 10px Arial;color:var(--cream);margin-top:1px}

  /* The next-wave panel. Hangs off the bottom of the wave counter so the two
     read as one block, and is only present between waves — during a wave the
     board is the information and a panel over it is in the way. */
  #wavePreview{min-width:172px;max-width:100%;
    padding:6px 12px 7px;border:3px solid var(--wood);border-radius:16px;
    background:var(--panel);box-shadow:0 5px 12px #0008;text-align:center;
    text-shadow:2px 2px 3px #000;opacity:0;transition:opacity .18s;
    pointer-events:none}
  #wavePreview.show{opacity:1}
  #previewHdr{font:900 9px Arial;color:var(--cream);letter-spacing:1.5px}
  #previewRoster{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;
    margin-top:3px}
  .pvUnit{position:relative;width:38px;height:38px}
  .pvUnit canvas{width:100%;height:100%;display:block}
  .pvUnit b{position:absolute;right:-1px;bottom:-2px;font:900 11px Arial;
    color:var(--gold);text-shadow:2px 2px 3px #000,0 0 4px #000}
  #previewThreats{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;
    margin-top:4px}
  .pvTag{font:900 9px Arial;letter-spacing:.6px;padding:2px 6px;border-radius:7px;
    background:#5a1c12;border:2px solid #a8412a;color:#ffcaa8}
  .pvTag.boss{background:#43135c;border-color:#9b4fd0;color:#efc6ff}
  .pvTag.held{background:#2c2a1c;border-color:#6b6045;color:#b9ac86}
  #previewBoss{font:900 9px Arial;color:#ff9c6b;letter-spacing:1px;margin-top:4px}
  #previewBoss:empty{display:none}

  /* The bet on the next wave. Its own strip below the preview, because it is
     the one thing in the HUD a player TAPS between waves — the rest of the
     HUD is read, and read-only furniture is pointer-events:none. */
  #wagerBar{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;
    max-width:100%;opacity:0;transition:opacity .18s;pointer-events:none}
  #wagerBar.show{opacity:1;pointer-events:auto}
  #wagerBar:empty{display:none}

  /* ---- portrait -----------------------------------------------------------
     A phone held upright cannot show a 16:9 board at any useful size, so the
     board is a band and the HUD sits above it rather than over it. These rules
     place the three bands from the measurements placeBands() publishes, so the
     HUD always touches the top of the board and the tray always touches the
     bottom of it, whatever height the next-wave panel happens to be. */
  /* The pause and speed buttons get a reserved column on the right, and both
     the stats box and the wave stack are bounded by it rather than being
     centred on the viewport and hoping. Centring is what put the pause button
     on top of LIVES, and then put the wave stack under it as well. */
  /* Pause and speed sit side by side in portrait rather than stacked. As a
     column they were tall enough to reach down past the stats box, which
     forced the wave stack to keep clear of the right edge for its whole
     height and left it visibly off-centre against the board. As a row they
     end above the stack, which can then span the full width and centre. */
  body.portrait{--ctrl-col:140px}
  body.portrait #rightControls{flex-direction:row;gap:7px;align-items:flex-start}
  body.portrait #stats{left:8px;transform:none;top:var(--hud-top,8px);
    width:auto;right:var(--ctrl-col);max-width:none;min-width:0}
  body.portrait #waveStack{top:calc(var(--hud-top,8px) + 88px);
    left:8px;right:8px;transform:none;max-width:none;align-items:center}
  body.portrait #rightControls{top:var(--hud-top,8px);right:8px}
  body.portrait #bottomBar{top:var(--tray-top,auto);bottom:auto}
  /* Over the board's own top edge, where there is contrast, rather than adrift
     on the background above it. */
  body.portrait #banner{top:calc(var(--board-top,50%) + 26px);transform:translate(-50%,0) scale(1)}
  body.portrait #banner.show{transform:translate(-50%,0) scale(1)}
  body.portrait #toast{bottom:auto;top:calc(var(--board-top,0px) - 30px)}

  /* The next-wave panel goes horizontal in portrait too. Stacked it was 220px
     tall on a 232px board, which is the single biggest reason the screen had
     no room left for anything. */
  body.portrait #wavePreview{display:flex;align-items:center;gap:8px;
    flex-wrap:wrap;justify-content:center;padding:4px 10px 5px}
  body.portrait #previewHdr{white-space:nowrap}
  body.portrait #previewRoster{margin-top:0}
  body.portrait #previewThreats{margin-top:0}
  body.portrait #previewBoss{margin-top:0;white-space:nowrap}

  /* The wager chips wrapped into SWIFT alone on one line with HARDENED and
     HORDE beneath it, reading as three loose buttons rather than a row of
     three choices. They shrink to fit one line instead. */
  #wagerBar{flex-wrap:nowrap;align-items:stretch}
  .wager{flex:1 1 0;min-width:0;padding:3px 4px 4px}
  .wager .n,.wager .r,.wager .p{white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  #wagerHint{flex:0 0 auto}
  @media(max-width:520px){
    #wagerHint{display:none}
    .wager .n{font-size:9px}
    .wager .r,.wager .p{font-size:7.5px}
  }
  .wager.full{opacity:.4}

  /* Workshop. Gems were a number that went up and bought nothing; this is
     where they go. Deliberately reachable from the menu rather than mid-run —
     these are decisions about the next run, not this one. */
  #menuShop{margin-top:8px;padding:6px 18px;border:3px solid var(--wood);
    border-radius:13px;background:rgba(28,30,20,.8);color:var(--gold);
    font:900 12px Arial;letter-spacing:1.5px;text-shadow:2px 2px 3px #000;
    pointer-events:auto}
  #menuShop:active{transform:scale(.95)}
  #shopOverlay{z-index:65}
  /* The painted frame needs its own inset, the same way the level select and
     the upgrade panel do — the art has a thick border and content laid edge to
     edge sits on top of it. The first version had no frame and no shade, so
     the menu behind it read straight through the list. */
  #shopWin{display:block;position:relative}
  #shopBody{position:absolute;left:11%;right:11%;top:13%;bottom:9%;z-index:2;
    display:flex;flex-direction:column}
  #shopTitle{flex:0 0 auto;text-align:center;color:var(--cream);
    font:900 clamp(18px,3.4vw,32px) Arial;text-shadow:3px 3px #21140d}
  #shopGems{flex:0 0 auto;text-align:center;color:var(--gold);margin:2px 0 10px;
    font:900 clamp(11px,2vw,16px) Arial;text-shadow:2px 2px #21140d}
  #shopList{flex:1;min-height:0;overflow-y:auto;display:flex;
    flex-direction:column;gap:8px}
  .shopRow{display:flex;align-items:center;gap:10px;text-align:left;
    border:3px solid #7a4a1e;border-radius:14px;background:#2a1a0f;
    padding:8px 10px;color:var(--cream);min-width:0}
  .shopRow .txt{flex:1;min-width:0}
  .shopRow .n{display:block;font:900 clamp(11px,2vw,16px) Arial;color:var(--gold);
    text-shadow:2px 2px #21140d}
  .shopRow .d{display:block;font:700 clamp(8px,1.4vw,12px) Arial;line-height:1.3;
    color:#e6d3a8;white-space:pre-line;margin-top:2px}
  .shopRow .buy{flex:0 0 auto;padding:4px 11px;border-radius:10px;
    background:#1d120b;border:2px solid #d8b56a;color:#fff;
    font:900 clamp(10px,1.7vw,14px) Arial;white-space:nowrap}
  .shopRow.owned{border-color:#c08a34;background:#3a2a12}
  .shopRow.owned .buy{background:#2f5a2c;border-color:#8bf39a;color:#d8ffd8}
  .shopRow.poor{opacity:.5}
  #shopClose{position:absolute;right:-2%;top:-4%;width:62px;height:62px;z-index:5}
  @media(max-width:760px){ #shopClose{width:46px;height:46px} }
  /* Landscape gives the window about 360px of height, and four rows at full
     size need more than that. They tighten rather than scroll: a list that has
     to be scrolled to discover the fourth unlock hides the thing a player came
     here to see. */
  @media(max-height:560px){
    #shopBody{top:11%;bottom:7%}
    #shopTitle{font-size:clamp(15px,2.6vw,22px)}
    #shopGems{margin:1px 0 6px}
    #shopList{gap:5px}
    .shopRow{padding:5px 9px;border-width:2px;border-radius:11px}
    .shopRow .d{font-size:clamp(8px,1.2vw,10px);line-height:1.25}
  }
  .wager{border:3px solid #7a4a1e;border-radius:12px;background:rgba(28,30,20,.88);
    padding:3px 8px 4px;color:var(--cream);text-align:center;min-width:0;
    box-shadow:0 4px 10px #0008;text-shadow:2px 2px 3px #000}
  .wager .n{display:block;font:900 10px Arial;color:var(--gold);letter-spacing:1px}
  .wager .r{display:block;font:900 8px Arial;color:#ff9c6b;letter-spacing:.4px}
  .wager .p{display:block;font:900 9px Arial;color:#8bf39a;letter-spacing:.4px}
  .wager.on{border-color:var(--gold);background:#4a3312}
  .wager:active{transform:scale(.95)}
  #wagerHint{font:900 8px Arial;color:var(--cream);letter-spacing:1.2px;
    align-self:center;opacity:.75;white-space:nowrap}

  #rightControls{position:absolute;right:2vw;top:2vh;display:flex;
    flex-direction:column;gap:10px;align-items:center}
  #pause{pointer-events:auto;width:62px;height:62px;border-radius:18px;
    border:3px solid #26180d;background:linear-gradient(#9a765c,#553820);
    color:#fff;font-size:26px;font-weight:900;box-shadow:0 4px 8px #0009}
  #callWave{pointer-events:auto;position:relative;width:82px;height:82px;
    border:0;background:transparent;padding:0}
  #callWave img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  #callWave .arrow{left:58%;top:30%;width:46%;height:38%}
  #callWave .lbl{position:absolute;left:50%;top:64%;transform:translateX(-50%);
    font:900 9px Arial;color:#fff1b0;text-shadow:2px 2px 2px #000;white-space:nowrap}
  #callWave[disabled]{opacity:.35}
  #callWave:not([disabled]):active{transform:scale(.94)}

  #bottomBar{position:absolute;left:1vw;right:1vw;bottom:1vh;
    height:min(104px,15vh);min-height:74px}
  #bottomBar .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
  #trayLabel{position:absolute;left:50%;top:-11%;transform:translateX(-50%);
    padding:3px 26px 5px;border:3px solid #c79645;border-bottom:0;
    border-radius:16px 16px 0 0;background:linear-gradient(var(--wood),var(--wood-d));
    font:900 clamp(13px,2vw,20px) Arial;color:#ffe8a3;text-shadow:2px 3px 2px #2a1208;
    z-index:2;white-space:nowrap}
  /* Centred, not left-packed: four slots in a full-width tray left a long
     empty plank with the TOWERS label floating over nothing. */
  #towerSlots{position:absolute;left:1.5%;right:16%;top:8%;height:84%;
    display:flex;gap:10px;align-items:center;justify-content:center}
  .slot{pointer-events:auto;position:relative;flex:1;height:100%;max-width:118px;
    border:3px solid #bbb;border-radius:16px;padding:2px;
    background:linear-gradient(#73451f,#3c2413);
    box-shadow:inset 0 0 0 3px #222,0 3px 6px #0009;overflow:hidden}
  .slot img{display:block;width:100%;height:72%;object-fit:contain;
    filter:drop-shadow(0 3px 2px #000)}
  .slot .cost{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);
    min-width:34px;padding:1px 6px;border-radius:9px;background:#1d120b;
    border:2px solid #d8b56a;color:#fff;font:900 12px Arial;text-shadow:1px 1px 2px #000}
  .slot.selected{outline:4px solid var(--gold);outline-offset:1px;
    transform:translateY(-3px)}
  .slot.poor{opacity:.5}
  .slot.poor .cost{border-color:#8a3a2a;color:#ffb8a8}
  .slot:active{transform:scale(.95)}
  #startWave{pointer-events:auto;position:absolute;right:1%;top:6%;height:88%;
    aspect-ratio:1;border:0;background:transparent;padding:0}
  #startWave img{width:100%;height:100%;object-fit:contain}
  #startWave .lbl{position:absolute;left:4%;right:4%;top:52%;
    font:900 11px/11px Arial;color:#ffe9a6;text-align:center;
    text-shadow:2px 2px 2px #000}
  #startWave[disabled]{opacity:.4}
  #startWave:not([disabled]):active{transform:scale(.95)}

  #toast{position:absolute;left:50%;bottom:19vh;transform:translateX(-50%);
    z-index:5;padding:7px 16px;border-radius:12px;background:rgba(20,12,6,.88);
    border:2px solid #c79645;color:#ffe8a3;font:900 13px Arial;white-space:nowrap;
    opacity:0;transition:opacity .2s ease}
  #toast.show{opacity:1}

  /* Banners. The board draws at about a fifth of its size on a phone, so
     anything announced ON it is unreadable — these are DOM, sized in viewport
     units, and legible at every size the game runs at. */
  /* Below the next-wave panel, not over it. Clearing a wave shows both at the
     same moment — the banner says what was just earned and the panel says what
     is coming — and the first version drew one straight through the other. */
  #banner{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%) scale(.82);
    z-index:6;text-align:center;pointer-events:none;opacity:0;
    transition:opacity .18s ease,transform .18s ease}
  #banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #banner b{display:block;font:900 clamp(24px,6.4vw,54px) Arial;letter-spacing:2px;
    color:var(--gold);text-shadow:4px 4px 0 #21140d,0 0 22px #000}
  #banner i{display:block;font:900 clamp(11px,2.4vw,19px) Arial;font-style:normal;
    letter-spacing:2px;color:var(--cream);text-shadow:3px 3px 0 #21140d;margin-top:4px}
  #banner.bad b{color:#ff8a5c}
  #banner.bad i{color:#ffc9b0}

  /* The lives readout is the answer to "how close am I to losing", so it stops
     being a quiet number once the answer is "very". */
  .stat.flash span{color:#ff7b5e}
  .stat.danger span{color:#ff6a4a;animation:lowPulse .85s ease-in-out infinite}
  @keyframes lowPulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media(prefers-reduced-motion:reduce){
    .stat.danger span{animation:none}
    #banner{transition:opacity .18s ease}
  }

  @media(max-width:760px){
    #stats{left:8px;top:8px;width:196px;min-width:0;padding:6px 8px;border-radius:15px}
    .stat{height:27px}
    .stat b{left:8px;top:7px;font-size:8px}
    .stat span{right:9px;top:3px;font-size:13px}
    #waveStack{top:88px;gap:5px;max-width:92vw}
    #banner{top:75%}
    #battleInfo{min-width:130px;padding:5px 10px;border-radius:12px}
    #wavePreview{min-width:130px;padding:4px 9px 5px;border-radius:12px}
    .pvUnit{width:30px;height:30px}
    .pvTag{font-size:8px;padding:2px 5px}
    #rightControls{right:8px;top:8px;gap:7px}
    #pause{width:50px;height:50px;font-size:21px;border-radius:14px}
    #callWave{width:66px;height:66px}
    #bottomBar{height:80px;bottom:5px;left:6px;right:6px}
    #towerSlots{gap:5px;right:17%}
    .slot{max-width:74px;border-radius:13px}
    .slot .cost{font-size:11px;min-width:30px}
    #toast{bottom:15vh;font-size:11px}
    #upgradePanel{left:6%;right:6%;padding:9px}
    #upgradeCards{gap:5px}
    #specPick{gap:5px}
    .specCard{padding:5px 6px;border-radius:11px}
    #specRow{margin-top:5px}
    #upgradeClose{width:46px;height:46px}
    .win{width:95vw;height:82vh}
  }
  /* Short-and-wide (phone held in landscape): the HUD must not eat the board. */
  @media(max-height:460px){
    #bottomBar{height:68px}
    .slot{max-width:62px}
    #stats{width:180px}
    #battleInfo{padding:4px 9px}
/* Landscape is the tightest case: stack, banner and tower tray all want the
       same vertical strip. The enemy count goes — the board and the next-wave
       panel both already say what is coming — and that buys the banner the
       room to sit between the stack and the tray instead of on one of them. */
    #enemyCount{display:none}
    #banner{top:73%}
    #banner b{font-size:clamp(20px,3.6vw,34px)}
    #banner i{font-size:clamp(9px,1.5vw,13px)}
    /* Landscape is how the game is actually held, and there the board fills
       the screen — so a tall panel parked at top-centre sits on the road. It
       only shows between waves and taps pass straight through it, but it
       still hides a pad you might want. Laid out as one row it covers a strip
       instead of a block. */
    #waveStack{max-width:min(560px,66vw)}
    #wavePreview{display:flex;align-items:center;gap:8px;
      max-width:100%;padding:3px 10px}
    #previewHdr{white-space:nowrap}
    #previewRoster{margin-top:0;flex-wrap:nowrap}
    #previewThreats{margin-top:0;flex-wrap:nowrap}
    #previewBoss{margin-top:0;white-space:nowrap}
    .pvUnit{width:26px;height:26px}
  }
</style>

<script>
  // An enhancement, and guarded: a page that cannot boot without a service
  // worker cannot boot from file://, which is exactly where a WebView build
  // and local development live.
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(e =>
        console.log('no service worker: ' + e.message));
    });
  }
</script>
